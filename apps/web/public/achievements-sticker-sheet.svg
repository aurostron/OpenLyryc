<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" width="1600" height="1280" style="background:#09090b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .card-bg { rx: 20px; stroke-width: 1.5; }
      .sticker-box { rx: 16px; stroke-width: 2; }
      .title { font-size: 18px; font-weight: 600; fill: #ffffff; letter-spacing: -0.01em; }
      .desc { font-size: 13px; fill: #a1a1aa; line-height: 1.4; }
      .tag { font-size: 11px; font-family: monospace; fill: #71717a; text-transform: uppercase; letter-spacing: 0.05em; }
      .ink { stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Sheet Header -->
  <g transform="translate(80, 70)">
    <text x="0" y="0" font-size="28" font-weight="300" fill="#ffffff" letter-spacing="-0.02em">OpenLyryc — Hand-Drawn Achievement Stickers</text>
    <text x="0" y="28" font-size="14" fill="#71717a">Artist Redraw Specification Sheet · 12 Vector Doodles · Style: Playful, Organic Sketch Lines, Semi-Thick Inking</text>
  </g>

  <!-- ================= ROW 1 ================= -->

  <!-- 1. The First Pioneer -->
  <g transform="translate(80, 140)">
    <rect width="330" height="250" fill="#121217" stroke="#27272a" class="card-bg" />
    <g transform="translate(24, 24)">
      <!-- Sticker Badge -->
      <rect width="72" height="72" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.3" class="sticker-box" />
      <g transform="translate(4, 4) scale(1)" stroke="#fcd34d" class="ink">
        <path d="M18 56 L18 10 M18 12 C26 7 34 17 44 11 C47 9 49 10 49 10 L49 32 C41 38 33 28 22 34 C19 35 18 34 18 34" stroke-width="3" fill="none" />
        <path d="M33 20 L34.5 23.5 L38 24 L35.5 26.5 L36 30 L33 28 L30 30 L30.5 26.5 L28 24 L31.5 23.5 Z" fill="#fcd34d" stroke-width="1.5" />
        <path d="M10 56 Q18 52 26 56 Q36 50 54 56" stroke-width="3" fill="none" />
        <path d="M50 16 L50 22 M47 19 L53 19" stroke-width="2.5" fill="none" />
      </g>
    </g>
    <text x="112" y="52" class="title">The First Pioneer</text>
    <text x="112" y="74" class="tag">#01 · MILESTONE</text>
    <text x="24" y="132" class="desc">Claimed the very first @username on</text>
    <text x="24" y="152" class="desc">OpenLyryc and laid the cornerstone.</text>
    <text x="24" y="195" font-size="12" fill="#d97706" font-family="monospace">Visual: Flag on mountain summit + star</text>
  </g>

  <!-- 2. Spacebar Ninja -->
  <g transform="translate(450, 140)">
    <rect width="330" height="250" fill="#121217" stroke="#27272a" class="card-bg" />
    <g transform="translate(24, 24)">
      <rect width="72" height="72" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" class="sticker-box" />
      <g transform="translate(4, 4) scale(1)" stroke="#6ee7b7" class="ink">
        <rect x="10" y="28" width="44" height="18" rx="5" stroke-width="3" fill="none" />
        <path d="M12 40 L52 40" stroke-width="2" stroke-dasharray="3 3" />
        <path d="M22 20 L24 24 M32 15 L32 23 M42 20 L40 24" stroke-width="2.5" />
        <path d="M27 37 L37 37" stroke-width="3" />
        <path d="M32 11 Q32 20 32 26" stroke-width="3" />
      </g>
    </g>
    <text x="112" y="52" class="title">Spacebar Ninja</text>
    <text x="112" y="74" class="tag">#02 · CRAFT</text>
    <text x="24" y="132" class="desc">Tapped Space over 1,000 times with</text>
    <text x="24" y="152" class="desc">laser timing without spilling tea.</text>
    <text x="24" y="195" font-size="12" fill="#059669" font-family="monospace">Visual: Spacebar key + speed sparks</text>
  </g>

  <!-- 3. Apple Music Perfectionist -->
  <g transform="translate(820, 140)">
    <rect width="330" height="250" fill="#121217" stroke="#27272a" class="card-bg" />
    <g transform="translate(24, 24)">
      <rect width="72" height="72" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.3" class="sticker-box" />
      <g transform="translate(4, 4) scale(1)" stroke="#fda4af" class="ink">
        <path d="M32 20 C26 14 16 16 15 28 C14 42 27 52 32 52 C37 52 50 42 49 28 C48 16 38 14 32 20 Z" stroke-width="3" fill="none" />
        <path d="M32 20 Q34 10 42 8 L42 16" stroke-width="3" fill="none" />
        <path d="M26 34 L30 38 L38 28" stroke-width="3" fill="none" />
      </g>
    </g>
    <text x="112" y="52" class="title">Apple Perfectionist</text>
    <text x="112" y="74" class="tag">#03 · CRAFT</text>
    <text x="24" y="132" class="desc">Exported pixel-perfect Apple TTML with</text>
    <text x="24" y="152" class="desc">syllable splits and vocal flourishes.</text>
    <text x="24" y="195" font-size="12" fill="#e11d48" font-family="monospace">Visual: Apple with note stem + check</text>
  </g>

  <!-- 4. Midnight Jammer -->
  <g transform="translate(1190, 140)">
    <rect width="330" height="250" fill="#121217" stroke="#27272a" class="card-bg" />
    <g transform="translate(24, 24)">
      <rect width="72" height="72" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.3" class="sticker-box" />
      <g transform="translate(4, 4) scale(1)" stroke="#a5b4fc" class="ink">
        <path d="M38 12 C24 14 16 26 18 40 C20 50 30 56 42 52 C30 50 26 34 32 24 C34 20 37 16 38 12 Z" stroke-width="3" fill="none" />
        <path d="M20 28 C16 16 42 14 44 26" stroke-width="3" fill="none" />
        <rect x="15" y="26" width="6" height="12" rx="3" stroke-width="2.5" fill="#a5b4fc" />
        <rect x="43" y="24" width="6" height="12" rx="3" stroke-width="2.5" fill="#a5b4fc" />
        <path d="M48 12 L54 12 L48 18 L54 18" stroke-width="2" />
      </g>
    </g>
    <text x="112" y="52" class="title">Midnight Jammer</text>
    <text x="112" y="74" class="tag">#04 · DEDICATION</text>
    <text x="24" y="132" class="desc">Timed lyrics past 2:00 AM because</text>
    <text x="24" y="152" class="desc">the track was hitting way too hard.</text>
    <text x="24" y="195" font-size="12" fill="#4f46e5" font-family="monospace">Visual: Crescent moon with headphones</text>
  </g>

  <!-- ================= ROW 2 ================= -->

  <!-- 5. WebCrypto Architect -->
  <g transform="translate(80, 420)">
    <rect width="330" height="250" fill="#121217" stroke="#27272a" class="card-bg" />
    <g transform="translate(24, 24)">
      <rect width="72" height="72" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.3" class="sticker-box" />
      <g transform="translate(4, 4) scale(1)" stroke="#67e8f9" class="ink">
        <circle cx="24" cy="24" r="10" stroke-width="3" fill="none" />
        <circle cx="24" cy="24" r="4" stroke-width="2" fill="none" />
        <path d="M32 30 L48 46" stroke-width="3" />
        <path d="M42 40 L46 36 M46 44 L50 40" stroke-width="3" />
        <path d="M12 18 L8 16 M20 10 L18 6" stroke-width="2" />
      </g>
    </g>
    <text x="112" y="52" class="title">WebCrypto Key</text>
    <text x="112" y="74" class="tag">#05 · MILESTONE</text>
    <text x="24" y="132" class="desc">Signed and verified lyrics on the</text>
    <text x="24" y="152" class="desc">immutable Unison catalog.</text>
    <text x="24" y="195" font-size="12" fill="#0891b2" font-family="monospace">Visual: Skeleton key with crypto spark</text>
  </g>

  <!-- 6. Zero Drift -->
  <g transform="translate(450, 420)">
    <rect width="330" height="250" fill="#121217" stroke="#27272a" class="card-bg" />
    <g transform="translate(24, 24)">
      <rect width="72" height="72" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.3" class="sticker-box" />
      <g transform="translate(4, 4) scale(1)" stroke="#c4b5fd" class="ink">
        <circle cx="32" cy="32" r="22" stroke-width="3" fill="none" />
        <circle cx="32" cy="32" r="13" stroke-width="2.5" stroke-dasharray="4 3" fill="none" />
        <circle cx="32" cy="32" r="4" fill="#c4b5fd" />
        <path d="M48 14 L34 28 M48 14 L42 15 M48 14 L47 20" stroke-width="3" fill="none" />
      </g>
    </g>
    <text x="112" y="52" class="title">Zero Drift</text>
    <text x="112" y="74" class="tag">#06 · CRAFT</text>
    <text x="24" y="132" class="desc">Timed 70+ lyric lines with less than</text>
    <text x="24" y="152" class="desc">30ms offset from audio transients.</text>
    <text x="24" y="195" font-size="12" fill="#7c3aed" font-family="monospace">Visual: Target bullseye with arrow hit</text>
  </g>

  <!-- 7. Syllable Surgeon -->
  <g transform="translate(820, 420)">
    <rect width="330" height="250" fill="#121217" stroke="#27272a" class="card-bg" />
    <g transform="translate(24, 24)">
      <rect width="72" height="72" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-opacity="0.3" class="sticker-box" />
      <g transform="translate(4, 4) scale(1)" stroke="#fdba74" class="ink">
        <path d="M16 24 L20 48 C20 52 40 52 40 48 L44 24 Z" stroke-width="3" fill="none" />
        <path d="M42 28 C50 28 50 40 40 42" stroke-width="3" fill="none" />
        <path d="M24 18 C22 14 26 12 24 8 M32 18 C30 14 34 12 32 8" stroke-width="2.5" fill="none" />
        <path d="M38 10 L42 9 L42 15 M42 15 A2 2 0 1 1 38 15 A2 2 0 0 1 42 15" stroke-width="2" fill="none" />
      </g>
    </g>
    <text x="112" y="52" class="title">Syllable Surgeon</text>
    <text x="112" y="74" class="tag">#07 · CRAFT</text>
    <text x="24" y="132" class="desc">Split complex multi-syllabic words for</text>
    <text x="24" y="152" class="desc">smooth karaoke stage scrolling.</text>
    <text x="24" y="195" font-size="12" fill="#ea580c" font-family="monospace">Visual: Steaming coffee mug + note steam</text>
  </g>

  <!-- 8. Mic Check 1-2 -->
  <g transform="translate(1190, 420)">
    <rect width="330" height="250" fill="#121217" stroke="#27272a" class="card-bg" />
    <g transform="translate(24, 24)">
      <rect width="72" height="72" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.3" class="sticker-box" />
      <g transform="translate(4, 4) scale(1)" stroke="#93c5fd" class="ink">
        <rect x="24" y="12" width="16" height="24" rx="8" stroke-width="3" fill="none" />
        <path d="M25 22 L39 22 M25 28 L39 28 M32 12 L32 36" stroke-width="2" />
        <path d="M18 24 C18 36 46 36 46 24" stroke-width="3" fill="none" />
        <path d="M32 36 L32 52 M22 52 L42 52" stroke-width="3" />
        <path d="M12 20 C10 24 10 28 12 32 M52 20 C54 24 54 28 52 32" stroke-width="2.5" />
      </g>
    </g>
    <text x="112" y="52" class="title">Mic Check 1-2</text>
    <text x="112" y="74" class="tag">#08 · MILESTONE</text>
    <text x="24" y="132" class="desc">Loaded your first stems and calibrated</text>
    <text x="24" y="152" class="desc">playback latency like an engineer.</text>
    <text x="24" y="195" font-size="12" fill="#2563eb" font-family="monospace">Visual: Vintage capsule mic + ripples</text>
  </g>

  <!-- ================= ROW 3 ================= -->

  <!-- 9. Crowd Favorite -->
  <g transform="translate(80, 700)">
    <rect width="330" height="250" fill="#121217" stroke="#27272a" class="card-bg" />
    <g transform="translate(24, 24)">
      <rect width="72" height="72" fill="#ec4899" fill-opacity="0.12" stroke="#ec4899" stroke-opacity="0.3" class="sticker-box" />
      <g transform="translate(4, 4) scale(1)" stroke="#f472b6" class="ink">
        <circle cx="32" cy="32" r="22" stroke-width="3" fill="none" />
        <circle cx="32" cy="32" r="16" stroke-width="1.5" stroke-dasharray="6 4" fill="none" />
        <circle cx="32" cy="32" r="9" stroke-width="2" fill="none" />
        <path d="M32 30 C30 27 27 28 27 30 C27 33 32 36 32 36 C32 36 37 33 37 30 C37 28 34 27 32 30 Z" fill="#f472b6" />
      </g>
    </g>
    <text x="112" y="52" class="title">Crowd Favorite</text>
    <text x="112" y="74" class="tag">#09 · MILESTONE</text>
    <text x="24" y="132" class="desc">Authored lyrics for heavy hitters:</text>
    <text x="24" y="152" class="desc">Atif Aslam (Tu Jaane Na) and Modjo.</text>
    <text x="24" y="195" font-size="12" fill="#db2777" font-family="monospace">Visual: Vinyl record + heart label</text>
  </g>

  <!-- 10. The Clean Cut -->
  <g transform="translate(450, 700)">
    <rect width="330" height="250" fill="#121217" stroke="#27272a" class="card-bg" />
    <g transform="translate(24, 24)">
      <rect width="72" height="72" fill="#eab308" fill-opacity="0.12" stroke="#eab308" stroke-opacity="0.3" class="sticker-box" />
      <g transform="translate(4, 4) scale(1)" stroke="#fde047" class="ink">
        <rect x="12" y="20" width="16" height="24" rx="4" stroke-width="2.5" fill="none" />
        <rect x="36" y="20" width="16" height="24" rx="4" stroke-width="2.5" fill="none" />
        <path d="M16 32 L24 32 M40 32 L48 32" stroke-width="2" />
        <path d="M32 10 L27 28 L35 28 L30 52" stroke-width="3" fill="none" />
      </g>
    </g>
    <text x="112" y="52" class="title">The Clean Cut</text>
    <text x="112" y="74" class="tag">#10 · CRAFT</text>
    <text x="24" y="132" class="desc">Separated overlapping harmonies into</text>
    <text x="24" y="152" class="desc">two distinct, cleanly timed lines.</text>
    <text x="24" y="195" font-size="12" fill="#ca8a04" font-family="monospace">Visual: Syllable blocks split by bolt</text>
  </g>

  <!-- 11. In The Groove -->
  <g transform="translate(820, 700)">
    <rect width="330" height="250" fill="#121217" stroke="#27272a" class="card-bg" />
    <g transform="translate(24, 24)">
      <rect width="72" height="72" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-opacity="0.3" class="sticker-box" />
      <g transform="translate(4, 4) scale(1)" stroke="#5eead4" class="ink">
        <path d="M14 34 C14 26 24 24 32 32 C40 40 50 38 50 30 C50 22 40 24 32 32 C24 40 14 38 14 34 Z" stroke-width="3" fill="none" />
        <circle cx="22" cy="28" r="1.5" fill="#5eead4" />
        <circle cx="42" cy="36" r="1.5" fill="#5eead4" />
        <path d="M28 16 C30 14 34 14 36 16 M28 48 C30 50 34 50 36 48" stroke-width="2.5" />
      </g>
    </g>
    <text x="112" y="52" class="title">In The Groove</text>
    <text x="112" y="74" class="tag">#11 · DEDICATION</text>
    <text x="24" y="132" class="desc">Maintained sync focus for over 30</text>
    <text x="24" y="152" class="desc">minutes without hitting undo once.</text>
    <text x="24" y="195" font-size="12" fill="#0d9488" font-family="monospace">Visual: Infinity wave loop + pulse</text>
  </g>

  <!-- 12. Catalog Master -->
  <g transform="translate(1190, 700)">
    <rect width="330" height="250" fill="#121217" stroke="#27272a" class="card-bg" />
    <g transform="translate(24, 24)">
      <rect width="72" height="72" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.3" class="sticker-box" />
      <g transform="translate(4, 4) scale(1)" stroke="#fde68a" class="ink">
        <path d="M14 44 L18 22 L26 32 L32 16 L38 32 L46 22 L50 44 Z" stroke-width="3" fill="none" />
        <path d="M14 44 L50 44 L48 50 L16 50 Z" stroke-width="2.5" fill="none" />
        <circle cx="24" cy="47" r="1.5" fill="#fde68a" />
        <circle cx="32" cy="47" r="1.5" fill="#fde68a" />
        <circle cx="40" cy="47" r="1.5" fill="#fde68a" />
        <circle cx="32" cy="14" r="2" fill="#fde68a" />
      </g>
    </g>
    <text x="112" y="52" class="title">Catalog Master</text>
    <text x="112" y="74" class="tag">#12 · MILESTONE</text>
    <text x="24" y="132" class="desc">Curated submissions across multiple</text>
    <text x="24" y="152" class="desc">formats in the public archive.</text>
    <text x="24" y="195" font-size="12" fill="#d97706" font-family="monospace">Visual: Royal crown with EQ peaks</text>
  </g>

  <!-- Sheet Footer Notes for Illustrator -->
  <g transform="translate(80, 1020)">
    <rect width="1440" height="180" fill="#18181b" stroke="#27272a" rx="16" />
    <text x="32" y="42" font-size="16" font-weight="600" fill="#ffffff">Notes for Artist / Redraw:</text>
    <text x="32" y="76" font-size="13" fill="#a1a1aa">1. Aesthetics: Hand-drawn, organic, sticker feel (like doodles in the margins of a music composition notebook).</text>
    <text x="32" y="102" font-size="13" fill="#a1a1aa">2. Inking: Consistent stroke width (2.5px to 3.5px), rounded linecaps (stroke-linecap: round), slightly imperfect sketchy curves.</text>
    <text x="32" y="128" font-size="13" fill="#a1a1aa">3. Deliverable format: SVG vectors (clean, ungrouped paths with viewBox="0 0 64 64") so they scale effortlessly to any resolution.</text>
    <text x="32" y="154" font-size="13" fill="#a1a1aa">4. Theme: Music production, audio engineering, rhythm, keyboards, microphone, coffee, and vinyl records.</text>
  </g>
</svg>
